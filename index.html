<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>가계부 | 2026년 10월</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#202536;--muted:#8991a2;--line:#e9ebf1;--blue:#4867e8;--red:#e15c68;--green:#15966c;--blue-soft:#eef1ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.wrap{width:min(100%,1020px);margin:auto;padding:22px 20px 44px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:23px;letter-spacing:-.7px;margin:0;font-weight:850}
.caption{font-size:12px;color:var(--muted);margin-top:5px}
.public-tag{font-size:11px;color:#6c7485;background:#eceef4;border-radius:20px;padding:6px 9px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 16px;min-width:0}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.metric-value{font-size:clamp(17px,2.8vw,24px);font-weight:850;letter-spacing:-.6px;white-space:nowrap}
.income .metric-value{color:var(--green)}.expense .metric-value{color:var(--red)}
.content{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.85fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:17px 17px 12px}
.month{font-size:19px;font-weight:850;letter-spacing:-.5px}
.nav{display:flex;gap:6px}
.nav button{height:34px;width:36px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:19px;color:var(--ink);cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:0 10px}
.week div{text-align:center;color:var(--muted);font-size:11px;font-weight:750;padding:7px 0}
.week div:first-child{color:var(--red)}.week div:last-child{color:var(--blue)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 10px 12px}
.day{min-width:0;min-height:83px;border:1px solid transparent;border-radius:10px;background:#fff;text-align:left;padding:6px 5px;cursor:pointer;color:var(--ink)}
.day:hover{background:#f8f9ff;border-color:#e3e7ff}
.day.selected{background:var(--blue-soft);border-color:#b9c5ff}
.day.outside{opacity:.28}
.day .date{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:12px;font-weight:800;border-radius:50%}
.day.today .date{background:var(--blue);color:white}
.day .amt{display:block;font-size:9px;line-height:1.4;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.day .amt.in{color:var(--green)}.day .amt.out{color:var(--red)}
.detail{padding:17px}
.detail-head{padding-bottom:13px;border-bottom:1px solid var(--line)}
.detail-date{font-size:18px;font-weight:850}
.detail-sum{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}
.group{margin-top:16px}
.group-head{display:flex;justify-content:space-between;font-size:12px;font-weight:850;margin-bottom:5px}
.group-head .total{font-variant-numeric:tabular-nums}
.item{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0f1f5;font-size:12px}
.item:last-child{border-bottom:0}
.item-name{min-width:0;overflow-wrap:anywhere;line-height:1.45}
.item-value{white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums}
.item.exp .item-value{color:var(--red)}.item.inc .item-value{color:var(--green)}
.empty{text-align:center;color:var(--muted);font-size:12px;padding:28px 8px;line-height:1.7}
footer{font-size:11px;color:var(--muted);text-align:center;margin-top:16px}
@media(max-width:760px){
 .wrap{padding:17px 11px 30px}
 header{margin-bottom:14px}
 h1{font-size:21px}
 .summary{gap:6px;margin-bottom:10px}
 .metric{padding:12px 9px;border-radius:12px}
 .metric-label{font-size:10px;margin-bottom:6px}
 .metric-value{font-size:clamp(14px,4vw,19px)}
 .content{grid-template-columns:1fr;gap:10px}
 .cal-head{padding:14px 13px 9px}
 .month{font-size:18px}
 .week{padding:0 6px}
 .days{padding:0 6px 9px;gap:2px}
 .day{min-height:68px;padding:4px 2px;border-radius:8px}
 .day .date{width:22px;height:22px;font-size:11px}
 .day .amt{font-size:8px;margin-top:3px;letter-spacing:-.2px}
 .detail{padding:14px}
 .detail-date{font-size:17px}
}
@media(max-width:360px){
 .wrap{padding-left:8px;padding-right:8px}
 .day{min-height:62px}
 .day .amt{font-size:7px}
}
</style>
</head>
<body>

<section class="summary">

  <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="days" id="days"></div>

 <section class="card detail">

  <div id="detailRows"></div>

</main>
<footer>표시된 내역은 공유용 가계부 데이터입니다.</footer>
</div>

function shift(n){month+=n;if(month<0){month=11;year--;}if(month>11){month=0;year++;}selected=`${year}-${pad(month+1)}-01`;render();}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
render();
</script>
